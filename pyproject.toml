[project]
name = "mappa"
version = "0.1.0"
description = "Paytm support tickets: intake, clarity module and the Jev decision engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "model2vec>=0.4",
    "bm25s>=0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mappa"]

[tool.pytest.ini_options]
pythonpath = ["."]



